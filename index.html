<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="点击按钮，通过已注册的应用协议唤醒本机 Clash Verge。">
  <meta name="theme-color" content="#0b1020">
  <title>Clash Verge · 一键唤醒</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #ecf1ff;
      background: #0b1020;
      background-image:
        radial-gradient(ellipse at 20% 10%, #20345d 0, transparent 55%),
        radial-gradient(ellipse at 90% 90%, #203448 0, transparent 50%);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(520px, 100%);
      padding: 48px 36px;
      border: 1px solid #ffffff20;
      border-radius: 28px;
      background: #151e32d9;
      box-shadow: 0 32px 90px #0005;
      text-align: center;
    }
    .icon {
      display: grid;
      place-items: center;
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
      border-radius: 24px;
      color: #13203b;
      background: linear-gradient(135deg, #79e1f3, #8a94ff);
      font-size: 40px;
      font-weight: 700;
    }
    .label { color: #91a6cc; font-size: 12px; letter-spacing: 3px; }
    h1 { margin: 14px 0; font-size: 34px; }
    p { color: #acbad3; line-height: 1.8; }
    .launch {
      display: block;
      width: 100%;
      margin: 22px 0 8px;
      padding: 17px;
      border: 0;
      border-radius: 14px;
      color: #122440;
      background: #a7c9ff;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }
    .launch:hover { background: #c1daff; transform: translateY(-2px); }
    .launch:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    #status { min-height: 25px; margin: 14px 0 0; font-size: 14px; }
    .footer { margin-top: 25px; color: #788aa9; font-size: 12px; }
    @media (max-width: 480px) { main { padding: 40px 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">↗</div>
    <div class="label">YOUR LOCAL LAUNCHPAD</div>
    <h1>Clash Verge</h1>
    <p>连接世界，从这里出发。<br>点击下方按钮，在浏览器提示中确认打开。</p>
    <a class="launch" id="launch" href="clash-verge://">唤醒 Clash Verge →</a>
    <p id="status" role="status" aria-live="polite">准备就绪</p>
    <div class="footer">应用协议唤起 · 无需本地启动服务</div>
  </main>
  <script>
    document.getElementById('launch').addEventListener('click', () => {
      document.getElementById('status').textContent =
        '请在浏览器提示中选择“打开 Clash Verge”。本页无法判断应用是否已打开。';
    });
  </script>
</body>
</html>
